<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocabMaster — Practice</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="app-header fade-in">
    <a href="index.html" class="app-logo">Vocab<span>Master</span></a>
    <a href="index.html" class="nav-link">← Back</a>
  </header>

  <!-- ── Score Strip ────────────────────────────────────────── -->
  <div class="score-strip fade-in">
    <div class="score-chip correct-chip" id="correctChip">✓ 0</div>
    <div class="score-chip wrong-chip"   id="wrongChip">✗ 0</div>
  </div>

  <!-- ── Progress Bar ───────────────────────────────────────── -->
  <div class="progress-header">
    <span class="progress-label">Progress</span>
    <span class="progress-count" id="progressCount">1 / ?</span>
  </div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <!-- ── Question Card ──────────────────────────────────────── -->
  <div class="question-card" id="questionCard">
    <p class="question-word-hint" id="wordHint">verb</p>
    <p class="question-sentence" id="sentence">Loading…</p>
  </div>

  <!-- ── MCQ Options ────────────────────────────────────────── -->
  <div class="options-grid" id="optionsGrid">
    <!-- Populated by practice.js -->
  </div>

  <!-- ── Feedback Bar ───────────────────────────────────────── -->
  <div class="feedback-bar hidden" id="feedback"></div>

  <!-- ── Next Button ────────────────────────────────────────── -->
  <div style="text-align: right; margin-top: 24px;">
    <button id="nextBtn" class="btn btn-primary hidden">Next Question →</button>
  </div>

  <div style="height: 60px;"></div>

</div><!-- /app-wrapper -->

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
