<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocabMaster — Practice</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="app-header fade-in">
    <a href="index.html" class="app-logo">Vocab<span>Master</span></a>
    <a href="index.html" class="nav-link">← Back</a>
  </header>

  <!-- ── Score Strip ────────────────────────────────────────── -->
  <div class="score-strip fade-in">
    <div class="score-chip correct-chip" id="correctChip">✓ 0</div>
    <div class="score-chip wrong-chip"   id="wrongChip">✗ 0</div>
  </div>

  <!-- ── Progress Bar ───────────────────────────────────────── -->
  <div class="progress-header">
    <span class="progress-label">Round</span>
    <span class="progress-count" id="progressCount">1 / ?</span>
  </div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <!-- ── Instruction ────────────────────────────────────────── -->
  <p class="match-instruction" id="matchInstruction">
    Bấm một từ, rồi bấm nghĩa tương ứng để ghép cặp
  </p>

  <!-- ── Matching Grid ──────────────────────────────────────── -->
  <div class="match-arena" id="matchArena">
    <div class="match-col" id="colWords">
      <!-- Word cards -->
    </div>
    <div class="match-col" id="colMeanings">
      <!-- Meaning cards -->
    </div>
  </div>

  <!-- ── Feedback Bar ───────────────────────────────────────── -->
  <div class="feedback-bar hidden" id="feedback"></div>

  <!-- ── Next Round Button ──────────────────────────────────── -->
  <div style="text-align: right; margin-top: 24px;">
    <button id="nextBtn" class="btn btn-primary hidden">Next Round →</button>
  </div>

  <div style="height: 60px;"></div>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
